[package]
name = "dmgez-lint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed layout and installer diagnostics for dmgez projects"

[features]
installer = ["dep:dmgez-builder", "dep:plist", "dep:quick-xml"]

[dependencies]
# Workspace foundation
dmgez-config.workspace = true

# Workspace presentation
dmgez-preview.workspace = true

# Workspace build
dmgez-builder = { workspace = true, optional = true }

# Serialization and configuration
plist = { workspace = true, optional = true, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
quick-xml = { workspace = true, optional = true }
serde.workspace = true

# Diagnostics
thiserror.workspace = true

[dev-dependencies]
# Serialization and configuration
serde_json.workspace = true

[lints]
workspace = true
