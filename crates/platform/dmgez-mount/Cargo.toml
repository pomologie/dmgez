[package]
name = "dmgez-mount"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only host disk-image mount sessions for dmgez"

[features]
default = []

# Read-only system mounts
system = [
	"dep:dmgez-core",
	"dep:dmgez-udif",
	"dep:dmgez-vfs",
	"dep:plist",
	"dep:rustix",
	"dep:serde",
	"dep:tempfile",
	"dep:thiserror",
]

[dependencies]
# Serialization and configuration
serde = { workspace = true, optional = true }

# Diagnostics
thiserror = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Workspace formats
dmgez-udif = { workspace = true, optional = true, features = ["read", "zlib"] }

# Workspace foundation
dmgez-core = { workspace = true, optional = true, features = ["native-process", "source"] }
dmgez-vfs = { workspace = true, optional = true, features = ["zlib"] }

# Serialization and configuration
plist = { workspace = true, optional = true, features = ["serde"] }

# Filesystem access and staging
rustix = { workspace = true, optional = true, features = ["process"] }
tempfile = { workspace = true, optional = true }

[lints]
workspace = true
