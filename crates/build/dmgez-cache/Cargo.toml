[package]
name = "dmgez-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private persistent compression block cache for dmgez"

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["write-cache"] }

# Diagnostics
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Filesystem access and staging
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Workspace foundation
dmgez-core = { workspace = true, features = ["native-directory-privacy"] }

[dev-dependencies]
# Filesystem access and staging
tempfile.workspace = true

[lints]
workspace = true
