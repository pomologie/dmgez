[package]
name = "dmgez-apfs-read"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/dmgez"
description = "Read-only APFS volume discovery, browsing and verification for dmgez"

[dependencies]
# dmgez crates
dmgez-vfs = { path = "../../foundation/dmgez-vfs", default-features = false }

# APFS libraries
apfs-container = { version = "=0.1.0", default-features = false }
apfs-core = { version = "=0.1.0", default-features = false }
apfs-format = { version = "=0.1.0", default-features = false }
apfs-reader = { version = "=0.1.0", default-features = false }

# Diagnostics
thiserror = "=2.0.21"

[lints.rust]
unsafe_code = "forbid"
