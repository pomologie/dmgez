[package]
name = "dmgez-diff"
version = "0.1.0"
description = "Bounded byte and filesystem comparison of admitted dmgez sources"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
finder-layout = ["dep:dmgez-finder"]
content-hash = ["dep:blake3"]

[dependencies]
# Workspace crates
dmgez-finder = { workspace = true, optional = true }
dmgez-vfs.workspace = true

# Hashes and checksums
blake3 = { workspace = true, optional = true }

# Serialization
serde.workspace = true

# Diagnostics
thiserror.workspace = true

[dev-dependencies]
# Workspace crates
dmgez-udif = { workspace = true, features = ["read", "zlib"] }

# Serialization
serde_json.workspace = true

[lints]
workspace = true
