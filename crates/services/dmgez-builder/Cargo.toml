[package]
name = "dmgez-builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plan and execute dmgez image builds"

[features]
default = ["finder-write", "parallel", "zlib"]
badge-icons = ["volume-icon", "dmgez-finder/badge-icons"]
compression-cache = ["zlib", "dep:dmgez-cache", "dmgez-udif/write-cache"]
finder-write = ["dep:dmgez-finder", "dep:dmgez-macho", "dep:flate2", "dep:png", "dep:tiff"]
lzfse = ["dmgez-udif/lzfse"]
lzma = ["dmgez-udif/lzma"]
parallel = ["dmgez-udif/parallel"]
volume-icon = ["finder-write", "dmgez-finder/volume-icon"]
zlib = ["dmgez-udif/zlib"]

[dependencies]
# Workspace formats
dmgez-macho = { workspace = true, optional = true }
dmgez-udif = { workspace = true, features = ["write"] }

# Workspace foundation
dmgez-config.workspace = true
dmgez-core = { workspace = true, features = ["source", "staging"] }

# Workspace presentation
dmgez-finder = { workspace = true, optional = true }

# Workspace services
dmgez-cache = { workspace = true, optional = true }

# Compression
flate2 = { workspace = true, optional = true }

# Image codecs
png = { version = "=0.18.1", optional = true }
tiff = { workspace = true, optional = true }

# Diagnostics
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Filesystem access and staging
globset.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# Filesystem access and staging
fs_at = "=0.2.1"
globset.workspace = true

# Windows filesystem APIs
windows-namespace-request-sys = "=0.5.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Filesystem access and staging
tempfile.workspace = true

[lints]
workspace = true
