[package]
name = "dmgez-hfsplus-read"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/dmgez"
description = "Read-only HFS+ and HFSX browsing and structural verification for dmgez"

[features]
default = []

# Volume browsing, analysis and verification
browse = ["dep:dmgez-vfs"]
analysis = ["browse", "dep:serde"]
preview = ["browse", "dep:dmgez-finder", "dep:dmgez-preview"]
verify = []

# File compression
decmpfs-zlib = ["hfsplus-reader/decmpfs-zlib"]

[dependencies]
# Workspace foundation
dmgez-vfs = { path = "../../foundation/dmgez-vfs", default-features = false, optional = true }

# Workspace presentation
dmgez-finder = { path = "../../presentation/dmgez-finder", default-features = false, optional = true }
dmgez-preview = { path = "../../presentation/dmgez-preview", default-features = false, features = ["actual", "png-render"], optional = true }

# HFS+ libraries
hfsplus-core = { package = "hfsplus-pomologie-core", version = "=0.1.0" }
hfsplus-format = "=0.1.0"
hfsplus-reader = "=0.1.0"

# Serialization and configuration
serde = { version = "1.0.229", features = ["derive"], optional = true }

# Diagnostics
thiserror = "=2.0.21"

[dev-dependencies]
# Workspace formats
dmgez-udif = { path = "../../formats/dmgez-udif", default-features = false, features = ["read"] }

[lints.rust]
unsafe_code = "forbid"
