[package]
name = "dmgez-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private persistent compression block cache for dmgez"

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["write-cache"] }

# Diagnostics
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Descriptor-relative filesystem access and ownership
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# Filesystem fixtures
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
