[package]
name = "dmgez-operations"
version = "0.1.0"
description = "Bounded extraction, conversion and editing operations for dmgez"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

# Image conversion and editing
convert = ["dep:dmgez-core", "dep:dmgez-udif", "dep:thiserror"]
edit = [
	"dep:dmgez-builder",
	"dep:dmgez-config",
	"dmgez-builder/zlib",
	"dmgez-config/project-edit",
	"dep:thiserror",
]
image-edit = [
	"edit",
	"dep:dmgez-udif",
	"dmgez-udif/signature-integrity",
	"dep:dmgez-vfs",
	"dep:rustix",
	"dep:sha2",
]

# Extraction and installation
extract = ["dep:dmgez-vfs", "dep:rustix", "dep:serde", "dep:tempfile", "dep:thiserror"]
install = ["extract", "dep:dmgez-config", "dep:plist", "dep:quick-xml"]

# Parallel execution
parallel = ["dmgez-udif?/parallel"]

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["read", "write", "zlib"], optional = true }

# Workspace foundation
dmgez-config = { workspace = true, optional = true }
dmgez-core = { workspace = true, features = ["staging"], optional = true }
dmgez-vfs = { workspace = true, optional = true }

# Workspace services
dmgez-builder = { workspace = true, optional = true }

# Hashes and checksums
sha2 = { workspace = true, optional = true }

# Serialization and configuration
plist = { workspace = true, optional = true, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
quick-xml = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# Diagnostics
thiserror = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Filesystem access and staging
rustix = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# Serialization and configuration
plist.workspace = true

# Filesystem access and staging
tempfile.workspace = true

[lints]
workspace = true
