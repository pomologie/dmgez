[package]
name = "dmgez-inspector"
version = "0.1.0"
description = "Structured read-only inspection and verification reports for dmgez"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["zlib"]
zlib = ["dmgez-udif/zlib"]
lzfse = ["dmgez-udif/lzfse"]
lzma = ["dmgez-udif/lzma"]
remote = []

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["read"] }

# Workspace foundation
dmgez-vfs.workspace = true

# Serialization and configuration
serde.workspace = true

[dev-dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["write"] }

# Serialization and configuration
plist.workspace = true
serde_json.workspace = true

[lints]
workspace = true
