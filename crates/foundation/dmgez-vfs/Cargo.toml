[package]
name = "dmgez-vfs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded read-only logical disk and partition access for dmgez"

[features]
default = ["zlib"]
zlib = ["dmgez-udif/zlib"]

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["read"] }

# Partition tables
gpt.workspace = true
part-tables.workspace = true

# Diagnostics
thiserror.workspace = true

[dev-dependencies]
# Hashes and checksums
crc32fast.workspace = true

[lints]
workspace = true
