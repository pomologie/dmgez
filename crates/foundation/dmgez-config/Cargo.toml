[package]
name = "dmgez-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned project configuration and validation for dmgez"

[features]
appdmg-import = ["dep:serde_json", "toml/display"]
project-edit = ["dep:toml_edit"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
toml_edit = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "project_edit_state_machine"
path = "verification/project_edit_state_machine.rs"
required-features = ["project-edit"]

[lints]
workspace = true
