[package]
name = "dmgez-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared I/O contracts for dmgez services"

[features]
default = []

# Source access and output staging
source = ["dep:thiserror"]
staging = ["dep:tempfile", "dep:thiserror", "dep:rustix"]

# Native host operations
native-process = ["dep:rustix", "dep:thiserror"]

[dependencies]
# Filesystem access and staging
tempfile = { workspace = true, optional = true }

# Diagnostics
thiserror = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Filesystem access and staging
rustix = { workspace = true, optional = true }

[lints]
workspace = true
