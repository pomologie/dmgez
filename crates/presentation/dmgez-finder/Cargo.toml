[package]
name = "dmgez-finder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generate Finder presentation records for dmgez images"

[features]
badge-icons = ["image-processing", "volume-icon"]
image-processing = ["dep:png"]
volume-icon = [
	"dep:crc32fast",
	"dep:icns",
	"plist/enable_unstable_features_that_may_break_with_minor_version_bumps",
]

[dependencies]
# Workspace foundation
dmgez-config.workspace = true

# Hashes and checksums
crc32fast = { workspace = true, optional = true }

# Finder metadata
alias_record = "=0.3.0"
ds_parser.workspace = true
plist.workspace = true

# Image codecs
icns = { workspace = true, optional = true }
png = { version = "=0.18.1", optional = true }

# Diagnostics
thiserror.workspace = true

[lints]
workspace = true
