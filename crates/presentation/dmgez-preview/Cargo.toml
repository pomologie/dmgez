[package]
name = "dmgez-preview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless preview geometry and design rendering for dmgez"

[features]
png-render = ["dep:dmgez-core", "dep:epaint", "dep:png"]

[dependencies]
# Workspace foundation
dmgez-config.workspace = true
dmgez-core = { workspace = true, optional = true, features = ["source"] }

# CPU text layout
epaint = { version = "=0.37.0", default-features = false, features = ["default_fonts"], optional = true }

# Image codecs
png = { version = "=0.18.1", optional = true }

# Diagnostics
thiserror.workspace = true

[dev-dependencies]
# Property testing
proptest.workspace = true

[lints]
workspace = true
