[package]
name = "dmgez-udif"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native UDIF disk image codecs for dmgez"

[features]
default = ["read", "write", "zlib"]

# UDIF reading, writing and block reuse
read = ["dep:dmgez-core", "dep:quick-xml", "dep:plist", "dep:crc32fast"]
write = ["dep:plist", "dep:crc32fast"]
write-cache = ["write", "zlib", "dep:sha2", "dep:zlib-rs"]

# Compression codecs
zlib = ["dep:flate2"]
lzfse = ["dep:lzfse_rust"]
lzma = ["dep:lzma-rust2"]

# Parallel execution
parallel = ["dep:rayon"]

# Signature integrity
signature-integrity = ["dep:sha2"]

[dependencies]
# Workspace foundation
dmgez-core = { workspace = true, optional = true, features = ["source"] }

# Compression
flate2 = { workspace = true, optional = true }
lzfse_rust = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
# Keep flate2's Rust backend aligned with the cache encoder revision.
zlib-rs = { workspace = true, optional = true }

# Hashes and checksums
crc32fast = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Serialization and configuration
plist = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

# Parallel execution
rayon = { workspace = true, optional = true }

# Diagnostics
thiserror.workspace = true

[dev-dependencies]
# Property testing
proptest.workspace = true

[lints]
workspace = true
