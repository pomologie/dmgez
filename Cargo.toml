[workspace]
resolver = "3"
members = ["crates/formats/dmgez-udif"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/dmgez"

[workspace.dependencies]
crc32fast = "1.5.5"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
plist = { version = "1.10.4", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", default-features = false }
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
