[workspace]
resolver = "3"
members = [
	"apps/dmgez",
	"apps/dmgez-cli",
	"crates/formats/dmgez-udif",
	"crates/foundation/dmgez-config",
	"crates/foundation/dmgez-core",
	"crates/foundation/dmgez-vfs",
	"crates/presentation/dmgez-finder",
	"crates/presentation/dmgez-preview",
	"crates/services/dmgez-builder",
	"crates/services/dmgez-diff",
	"crates/services/dmgez-inspector",
	"crates/services/dmgez-lint",
	"crates/services/dmgez-operations",
]
default-members = ["apps/dmgez-cli"]
exclude = ["crates/services/dmgez-hfsplus", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/dmgez"

[workspace.dependencies]
clap = { version = "4.6.8", features = ["derive"] }
crc32fast = "1.5.5"
dmgez-config = { path = "crates/foundation/dmgez-config" }
dmgez-core = { path = "crates/foundation/dmgez-core", default-features = false }
dmgez-diff = { path = "crates/services/dmgez-diff" }
dmgez-finder = { path = "crates/presentation/dmgez-finder" }
dmgez-inspector = { path = "crates/services/dmgez-inspector", default-features = false }
dmgez-lint = { path = "crates/services/dmgez-lint" }
dmgez-operations = { path = "crates/services/dmgez-operations", default-features = false }
dmgez-preview = { path = "crates/presentation/dmgez-preview" }
dmgez-udif = { path = "crates/formats/dmgez-udif", default-features = false }
dmgez-vfs = { path = "crates/foundation/dmgez-vfs", default-features = false }
ds_parser = "=0.4.0"
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
globset = { version = "0.4.21", default-features = false }
gpt = { version = "=4.1.0", default-features = false }
icns = { version = "=0.5.0", default-features = false, features = ["pngio"] }
lzfse_rust = { version = "=0.2.1", default-features = false }
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
part-tables = { version = "=0.1.0", default-features = false, features = ["apm", "mbr"] }
plist = { version = "1.10.4", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", default-features = false }
rayon = "1.12.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["display", "parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
