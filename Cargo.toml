[workspace]
resolver = "3"
members = [
	# Applications
	"apps/dmgez",
	"apps/dmgez-cli",
	"apps/dmgez-mcp",

	# Formats
	"crates/formats/dmgez-macho",
	"crates/formats/dmgez-udif",

	# Foundation
	"crates/foundation/dmgez-config",
	"crates/foundation/dmgez-core",
	"crates/foundation/dmgez-vfs",

	# Platform
	"crates/platform/dmgez-mount",

	# Presentation
	"crates/presentation/dmgez-finder",
	"crates/presentation/dmgez-preview",

	# Security
	"crates/security/dmgez-signing",

	# Build
	"crates/build/dmgez-builder",
	"crates/build/dmgez-cache",

	# Inspection
	"crates/inspection/dmgez-diff",
	"crates/inspection/dmgez-inspector",
	"crates/inspection/dmgez-lint",

	# Runtime
	"crates/runtime/dmgez-operations",
]
default-members = ["apps/dmgez-cli"]
exclude = [
	# Composed filesystem adapters
	"crates/adapters/dmgez-apfs-read",
	"crates/adapters/dmgez-hfsplus",
	"crates/adapters/dmgez-hfsplus-read",

	# Fuzz harness
	"fuzz",

	# Vendored dependencies
	"third_party/apple-codesign",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/dmgez"

[workspace.dependencies]
# Workspace formats
dmgez-macho = { path = "crates/formats/dmgez-macho" }
dmgez-udif = { path = "crates/formats/dmgez-udif", default-features = false }

# Workspace foundation
dmgez-config = { path = "crates/foundation/dmgez-config" }
dmgez-core = { path = "crates/foundation/dmgez-core", default-features = false }
dmgez-vfs = { path = "crates/foundation/dmgez-vfs", default-features = false }

# Workspace platform
dmgez-mount = { path = "crates/platform/dmgez-mount", default-features = false }

# Workspace presentation
dmgez-finder = { path = "crates/presentation/dmgez-finder" }
dmgez-preview = { path = "crates/presentation/dmgez-preview" }

# Workspace security
dmgez-signing = { path = "crates/security/dmgez-signing", default-features = false }

# Workspace build
dmgez-builder = { path = "crates/build/dmgez-builder", default-features = false }
dmgez-cache = { path = "crates/build/dmgez-cache" }

# Workspace inspection
dmgez-diff = { path = "crates/inspection/dmgez-diff" }
dmgez-inspector = { path = "crates/inspection/dmgez-inspector", default-features = false }
dmgez-lint = { path = "crates/inspection/dmgez-lint" }

# Workspace runtime
dmgez-operations = { path = "crates/runtime/dmgez-operations", default-features = false }

# Compression
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
lzfse_rust = { version = "=0.2.1", default-features = false }
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
zlib-rs = { version = "=0.6.8", default-features = false }

# Hashes and checksums
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
crc32fast = "1.5.5"
sha2 = { version = "0.11.1", default-features = false }

# Partition tables
gpt = { version = "=4.1.0", default-features = false }
part-tables = { version = "=0.1.0", default-features = false, features = ["apm", "mbr"] }

# Finder metadata
ds_parser = "=0.4.0"

# Image codecs
icns = { version = "=0.5.0", default-features = false, features = ["pngio"] }
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw"] }

# Serialization and configuration
plist = { version = "=1.10.4", default-features = false }
quick-xml = { version = "0.42.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["display", "parse"] }

# Filesystem access and staging
globset = { version = "0.4.21", default-features = false }
rustix = { version = "1.1.6", features = ["fs"] }
same-file = "=1.0.6"
tempfile = "3.27.0"

# HTTP range transport
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

# Apple code signing
apple-codesign = { path = "third_party/apple-codesign", version = "=0.29.0", default-features = false }

# Parallel execution
rayon = "1.12.0"

# Command-line interface
clap = { version = "4.6.8", features = ["derive"] }

# Desktop interface
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

# Diagnostics
thiserror = "2.0.21"

# Property testing
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(feature, values("project-build", "project-release", "project-edit", "mount-watch", "partition-write", "image-edit", "finder-write", "compression-cache", "hfsplus-read", "actual-preview", "hfsplus-analysis", "hfsplus-verify", "hfsplus-extract", "hfsplus-decmpfs", "hfsplus-install", "apfs-read", "apfs-extract", "apfs-install"))'] }
