name: Rust and image verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: |
          python3 -B tools/test_check_rust_roots.py
          python3 tools/check_rust_roots.py
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo fmt --manifest-path crates/services/dmgez-hfsplus/Cargo.toml -- --check
      - run: cargo install --locked cargo-nextest --version '=0.9.151'
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --all-features
      - run: cargo test --locked --doc --workspace --all-features
      - run: cargo check --locked -p dmgez-cli
      - run: cargo check --locked -p dmgez-cli --no-default-features
      - run: cargo check --locked -p dmgez-cli --no-default-features --features build
      - run: cargo check --locked -p dmgez-cli --no-default-features --features inspect
      - run: cargo check --locked -p dmgez-cli --no-default-features --features convert
      - run: cargo check --locked -p dmgez-cli --no-default-features --features diff
      - run: cargo check --locked -p dmgez-cli --no-default-features --features lint
      - run: cargo check --locked -p dmgez-cli --no-default-features --features appdmg-import
      - run: python3 tools/check_architecture.py

  supply-chain-and-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - run: cargo install --locked cargo-deny --version '=0.20.2'
      - run: cargo install --locked cargo-audit --version '=0.22.2'
      - run: cargo install --locked cargo-llvm-cov --version '=0.9.2'
      - run: cargo deny check
      - run: cargo audit
      - run: cargo llvm-cov --locked --workspace --all-features --summary-only
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo +1.98.0 check --locked --workspace --all-features

  parser-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-11-04 --profile minimal --component rust-src
      - run: cargo install --locked cargo-fuzz --version '=0.13.2'
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: |
          corpus=$(mktemp -d)
          cp tests/fixtures/images/*.dmg "$corpus/"
          cp crates/formats/dmgez-udif/tests/fixtures/apple-ulfo.dmg "$corpus/"
          CARGO_NET_OFFLINE=true cargo +nightly-2026-11-04 fuzz run udif "$corpus" -- -max_total_time=20 -max_len=65536 -timeout=5 -rss_limit_mb=1024
          git diff --exit-code -- fuzz/Cargo.lock

  range-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo install --locked kani-verifier --version '=0.68.0'
      - run: cargo kani setup
      - run: bash crates/formats/dmgez-udif/verification/check.sh
      - run: bash crates/foundation/dmgez-vfs/verification/check.sh
      - run: bash crates/services/dmgez-operations/verification/check.sh

  native-udif:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: brew install sevenzip
      - run: 7zz i
      - run: cargo build --locked -p dmgez-cli --all-features
      - run: python3 tests/compatibility/verify_udif.py target/debug/dmgez --seven-zip 7zz --attach-hfs
