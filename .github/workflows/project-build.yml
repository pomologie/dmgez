name: Cross-platform DMG project build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HFSPLUS_REVISION: ba00b162234f80b1dadd1733420306941d6ff797

jobs:
  registry-package:
    name: Assemble the Cargo release candidate
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned Pomologie HFS+ source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pomologie/hfsplus
          ref: ${{ env.HFSPLUS_REVISION }}
          path: hfsplus
          token: ${{ secrets.HFSPLUS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Package and verify the locked source
        id: package
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/dmgez-registry.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          channel=$(rustup show active-toolchain | cut -d ' ' -f 1)
          export RUSTUP_TOOLCHAIN="$channel"
          export CARGO_TARGET_DIR="$scratch/target"
          cargo fetch --locked
          cargo build --locked --offline -p xtask
          python3 -B tools/prepare_registry_package.py --hfsplus hfsplus \
            --xtask "$CARGO_TARGET_DIR/debug/xtask" --output "$scratch/dmgez" --fetch
          cargo package --locked --offline --manifest-path "$scratch/dmgez/Cargo.toml"
          archives=("$CARGO_TARGET_DIR"/package/*.crate)
          test "${#archives[@]}" -eq 1 && test -f "${archives[0]}"
          candidate="$RUNNER_TEMP/dmgez-registry-candidate"
          mkdir "$candidate"
          cp "${archives[0]}" "$candidate/"
          checksum=$(sha256sum "${archives[0]}" | cut -d ' ' -f 1)
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
      - name: Upload the Cargo release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmgez-registry-candidate
          path: ${{ runner.temp }}/dmgez-registry-candidate/*.crate
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build:
    name: Build, sign, and verify DMGs (${{ matrix.os }})
    needs: registry-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned Pomologie HFS+ source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pomologie/hfsplus
          ref: ${{ env.HFSPLUS_REVISION }}
          path: hfsplus
          token: ${{ secrets.HFSPLUS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - run: rustup show active-toolchain
      - name: Install 7-Zip on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends 7zip
      - name: Install 7-Zip on macOS
        if: runner.os == 'macOS'
        run: brew install sevenzip
      - name: Prepare NTFS working storage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:LOCALAPPDATA "Temp\dmgez-project-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($work))
          if ($drive.DriveFormat -ne 'NTFS') {
            throw "The Windows DMG project build requires NTFS scratch storage. Found $($drive.DriveFormat) at $($drive.Name)."
          }
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          "PROJECT_CI_DIR=$work" >> $env:GITHUB_ENV
          "TEMP=$work" >> $env:GITHUB_ENV
          "TMP=$work" >> $env:GITHUB_ENV
      - name: Verify Windows NTFS source discovery
        if: runner.os == 'Windows'
        run: cargo test --locked -p dmgez-builder --test windows_manifest
      - name: Install the pinned notice scanner
        run: cargo install --locked --version '=0.9.3' --features cli cargo-about
      - name: Build, sign, and verify dmg.toml
        id: project
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tomllib

          hfsplus = Path("hfsplus").resolve(strict=True)
          revision = subprocess.check_output(["git", "-C", hfsplus, "rev-parse", "HEAD"], text=True).strip()
          if revision != os.environ["HFSPLUS_REVISION"]:
              sys.exit(f"Expected the pinned HFS+ revision, found {revision}")
          print(f"HFS+ revision {revision}", flush=True)

          seven_zip = shutil.which("7zz") or shutil.which("7z")
          if sys.platform == "win32" and not seven_zip:
              bundled = Path(os.environ["ProgramFiles"]) / "7-Zip" / "7z.exe"
              if bundled.is_file():
                  seven_zip = str(bundled)
          if not seven_zip:
              sys.exit("7-Zip is required to verify the HFS+ payload")

          with Path("rust-toolchain.toml").open("rb") as manifest:
              toolchain = tomllib.load(manifest)["toolchain"]["channel"]
          target = subprocess.check_output(
              ["rustup", "run", toolchain, "rustc", "--print", "host-tuple"], text=True,
          ).strip()
          work = Path(os.environ.get("PROJECT_CI_DIR") or os.environ["RUNNER_TEMP"]) / "dmgez-project"
          compose = [
              sys.executable, "-B", "tools/compose_hfsplus_cli.py", "--hfsplus", hfsplus,
              "--target-dir", work / "target", "--release", "--features", "inspect",
          ]
          environment = os.environ.copy()
          if sys.platform == "win32":
              if target != "x86_64-pc-windows-msvc":
                  sys.exit(f"Expected an x86-64 Windows MSVC toolchain, found {target}")
              environment["CARGO_BUILD_TARGET"] = target
          handoff = work / "notice-review"
          handoff.mkdir(parents=True)
          build_options = [
              "--fetch", "--notices-output", handoff / "THIRD_PARTY_NOTICES.draft.txt",
              "--notices-lock-output", handoff / "composed-Cargo.lock",
              "--audit-lock-output", handoff / "cli-audit.lock",
          ]
          built = Path(subprocess.check_output([*compose, *build_options], env=environment, text=True).strip())
          executable = handoff / built.name
          shutil.copy2(built, executable)
          images = work / "images"
          native = ["--native-filesystem"] if sys.platform == "darwin" else []
          for mode in ("udro", "udzo"):
              subprocess.run([
                  sys.executable, "-B", "tests/compatibility/project-build/check_ci_project.py",
                  executable, images / mode, "--format", mode, "--seven-zip", seven_zip, *native,
              ], check=True)
          subprocess.run([
              sys.executable, "-B", "tests/compatibility/project-build/check_supplementary_names.py",
              executable, "--seven-zip", seven_zip, *native,
          ], check=True)
          subprocess.run([*compose, "--test"], env=environment, check=True)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (handoff / "source-revisions.txt").write_text(
              f"dmgez = {commit}\nHFS+ = {revision}\nRust target = {target}\n", encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"images={images}", file=output)
              print(f"executable={executable}", file=output)
              print(f"target={target}", file=output)
              print(f"notice_review={handoff}", file=output)
              print(f"seven_zip={seven_zip}", file=output)
      - name: Download the Cargo release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmgez-registry-candidate
          path: ${{ runner.temp }}/dmgez-registry-candidate
      - name: Verify the CLI and library from the shared Cargo archive
        env:
          DMGEZ_SEVEN_ZIP: ${{ steps.project.outputs.seven_zip }}
          DMGEZ_ARCHIVE_SHA256: ${{ needs.registry-package.outputs.sha256 }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          with Path("rust-toolchain.toml").open("rb") as manifest:
              channel = tomllib.load(manifest)["toolchain"]["channel"]
          environment = os.environ | {"RUSTUP_TOOLCHAIN": channel}
          directory = Path(os.environ["RUNNER_TEMP"]) / "dmgez-registry-candidate"
          archive, = directory.glob("*.crate")
          native = ["--native-filesystem"] if sys.platform == "darwin" else []
          subprocess.run([
              sys.executable, "-B", "tools/check_registry_package.py", archive,
              "--sha256", os.environ["DMGEZ_ARCHIVE_SHA256"],
              "--seven-zip", os.environ["DMGEZ_SEVEN_ZIP"], *native,
          ], env=environment, check=True)
      - name: Verify offline CLI archive on this host
        env:
          DMGEZ_EXECUTABLE: ${{ steps.project.outputs.executable }}
          DMGEZ_TARGET: ${{ steps.project.outputs.target }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(prefix="dmgez-notice-fixture-") as temporary:
              notices = Path(temporary) / "test-notices.txt"
              notices.write_text("Packaging smoke test notice fixture.\n", encoding="utf-8")
              subprocess.run([
                  sys.executable, "-B", "tools/test_package_cli.py",
                  "--binary", os.environ["DMGEZ_EXECUTABLE"], "--target", os.environ["DMGEZ_TARGET"], "--notices", notices,
              ], check=True)
      - name: Upload the tested executable and notice review inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os == 'Windows' && 'windows-msvc-notice-review' || format('notice-review-{0}', steps.project.outputs.target) }}
          path: ${{ steps.project.outputs.notice_review }}
          if-no-files-found: error
      - name: Upload the verified DMGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-image-${{ matrix.os }}
          path: ${{ steps.project.outputs.images }}
          if-no-files-found: error
          compression-level: 0

  release-advisories:
    name: Audit the built CLI dependencies for all three hosts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*notice-review*'
          path: notice-review
      - run: cargo install --locked cargo-audit --version '=0.22.2'
      - name: Check each build inventory against RustSec
        shell: bash
        run: |
          failed=0
          for handoff in notice-review/{notice-review-aarch64-apple-darwin,notice-review-x86_64-unknown-linux-gnu,windows-msvc-notice-review}; do
            cargo audit --file "$handoff/cli-audit.lock" --deny unmaintained --deny unsound --deny yanked || failed=1
          done
          exit "$failed"

  compare-images:
    name: Compare verified images from all three hosts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: project-image-*
          path: images
      - name: Verify byte-for-byte equality
        shell: bash
        run: |
          for image in {udro,udzo}/{installer,installer-adhoc}.dmg; do
            files=(
              "images/project-image-ubuntu-24.04/$image"
              "images/project-image-macos-15/$image"
              "images/project-image-windows-2025/$image"
            )
            sha256sum "${files[@]}"
            cmp "${files[0]}" "${files[1]}"
            cmp "${files[0]}" "${files[2]}"
          done
