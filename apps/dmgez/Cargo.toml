[package]
name = "dmgez-gui"
version = "0.1.0"
description = "Native project studio and disk image inspector for dmgez"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Optional image codecs
lzfse = ["dmgez-udif/lzfse"]
lzma = ["dmgez-udif/lzma"]

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["read"] }

# Workspace foundation
dmgez-config = { workspace = true, features = ["project-edit"] }
dmgez-core = { workspace = true, features = ["staging"] }

# Workspace presentation
dmgez-preview.workspace = true

# Workspace runtime
dmgez-runtime = { workspace = true, features = ["project-save", "report-export"] }

# Workspace inspection
dmgez-inspector = { workspace = true, features = ["zlib"] }
dmgez-lint.workspace = true

# Desktop interface
eframe.workspace = true
rfd.workspace = true

# Local preferences
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# Diagnostics
thiserror.workspace = true

[dev-dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["write"] }

[lints]
workspace = true
