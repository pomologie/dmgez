[package]
name = "dmgez-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Create and inspect macOS disk images"
publish = false

[[bin]]
name = "dmgez"
path = "src/main.rs"

[features]
default = ["build", "parallel"]
build = ["dep:dmgez-core", "dmgez-core/source", "dep:dmgez-udif", "dmgez-udif/write", "dmgez-udif/zlib"]
convert = ["dep:dmgez-operations", "dmgez-operations/convert", "dep:dmgez-udif"]
diff = ["dep:dmgez-diff", "dep:dmgez-udif", "dmgez-udif/read", "dmgez-udif/zlib", "dep:dmgez-vfs", "dep:serde", "dep:serde_json"]
parallel = ["dmgez-udif?/parallel", "dmgez-operations?/parallel"]
lzfse = ["dmgez-udif?/lzfse"]
lzma = ["dmgez-udif?/lzma"]
inspect = ["dep:dmgez-core", "dep:dmgez-inspector", "dmgez-inspector/zlib", "dep:dmgez-udif", "dmgez-udif/read", "dep:dmgez-vfs", "dep:serde", "dep:serde_json"]

[dependencies]
clap.workspace = true
dmgez-core = { workspace = true, optional = true, features = ["staging"] }
dmgez-diff = { workspace = true, optional = true }
dmgez-inspector = { workspace = true, optional = true }
dmgez-operations = { workspace = true, optional = true }
dmgez-udif = { workspace = true, optional = true }
dmgez-vfs = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
