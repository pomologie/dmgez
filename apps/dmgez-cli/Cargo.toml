[package]
name = "dmgez-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Create and inspect macOS disk images"
publish = false

[[bin]]
name = "dmgez"
path = "src/main.rs"

[features]
default = ["build", "parallel", "signing-rust"]

# Image creation and conversion
build = [
	"dep:dmgez-core",
	"dmgez-core/source",
	"dmgez-runtime/encoding",
	"dmgez-runtime/raw-wrap",
	"dep:dmgez-udif",
	"dmgez-udif/write",
	"dmgez-udif/zlib",
]
convert = ["dep:dmgez-operations", "dmgez-operations/convert", "dmgez-runtime/encoding", "dep:dmgez-udif"]

# Inspection and comparison
inspect = [
	"dep:dmgez-core",
	"dep:dmgez-inspector",
	"dmgez-inspector/zlib",
	"dep:dmgez-runtime",
	"dmgez-runtime/raw-export",
	"dep:dmgez-udif",
	"dmgez-udif/read",
	"dep:dmgez-vfs",
	"dep:serde",
	"dep:serde_json",
]
diff = [
	"dep:dmgez-diff",
	"dmgez-runtime/compare",
	"dep:dmgez-udif",
	"dmgez-udif/read",
	"dmgez-udif/zlib",
	"dep:dmgez-vfs",
	"dep:serde",
	"dep:serde_json",
]
diff-hash = ["diff", "dmgez-diff/content-hash"]
finder-diff = ["diff", "dmgez-diff/finder-layout"]

# Remote inspection
remote = ["inspect", "dmgez-inspector/remote-http"]

# Project configuration and linting
appdmg-import = ["dmgez-runtime/appdmg-import"]
lint = ["dep:dmgez-lint", "dmgez-runtime/lint", "dep:serde", "dep:serde_json"]

# Headless design preview
preview = ["dmgez-runtime/preview"]

# Installer checks
installer-lint = ["lint", "dmgez-runtime/installer-lint"]
installer-test = ["inspect", "dep:dmgez-operations", "dmgez-operations/install", "dmgez-runtime/installer-test"]

# Host mount sessions
mount-system = ["dep:dmgez-mount", "dmgez-mount/system", "dep:serde", "dep:serde_json"]

# Signing and notarization
signing-rust = ["dmgez-signing/rust", "dmgez-runtime?/signing-rust", "dep:serde", "dep:serde_json"]
signing-native = [
	"dep:dmgez-signing",
	"dmgez-signing/native",
	"dmgez-runtime?/signing-native",
	"dep:serde",
	"dep:serde_json",
]
notarization-native = ["signing-native", "dmgez-signing/notarization-native", "dmgez-runtime?/notarization-native"]

# Parallel execution and compression
parallel = ["dmgez-udif?/parallel", "dmgez-operations?/parallel", "dmgez-runtime?/parallel"]
lzfse = ["dmgez-udif?/lzfse"]
lzma = ["dmgez-udif?/lzma"]

[dependencies]
# Workspace formats
dmgez-udif = { workspace = true, optional = true }

# Workspace foundation
dmgez-config = { workspace = true, optional = true }
dmgez-core = { workspace = true, optional = true, features = ["staging"] }
dmgez-vfs = { workspace = true, optional = true }

# Workspace platform
dmgez-mount = { workspace = true, optional = true }

# Workspace security
dmgez-signing = { workspace = true, optional = true }

# Workspace runtime
dmgez-operations = { workspace = true, optional = true }
dmgez-runtime = { workspace = true, optional = true }

# Workspace inspection
dmgez-diff = { workspace = true, optional = true }
dmgez-inspector = { workspace = true, optional = true }
dmgez-lint = { workspace = true, optional = true }

# Serialization and configuration
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Command-line interface
clap.workspace = true

[dev-dependencies]
# Workspace foundation
dmgez-config.workspace = true

# Image codecs
png = "=0.18.1"

# Filesystem access and staging
tempfile.workspace = true

[lints]
workspace = true
