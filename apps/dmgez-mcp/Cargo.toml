[package]
name = "dmgez-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local MCP tools for dmgez projects"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Workspace foundation
dmgez-config.workspace = true
dmgez-core = { workspace = true, features = ["source"] }

# Serialization and configuration
serde.workspace = true

# Filesystem access and staging
rustix.workspace = true

# Async runtime
tokio = { version = "1.54.1", default-features = false, features = ["io-std", "rt"] }

# Command-line interface
clap.workspace = true

# MCP protocol
rmcp = { version = "=3.11.0", default-features = false, features = ["macros", "server"] }

[dev-dependencies]
# Serialization and configuration
serde_json.workspace = true

# Filesystem access and staging
tempfile.workspace = true

[lints]
workspace = true
