[package]
name = "dmgez-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local MCP tools for dmgez projects"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
clap.workspace = true
dmgez-config.workspace = true
dmgez-core = { workspace = true, features = ["source"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["macros", "server"] }
rustix.workspace = true
serde.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["io-std", "rt"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
