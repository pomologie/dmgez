[package]
name = "dmgez-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local MCP tools for dmgez projects"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# Workspace formats
dmgez-udif = { workspace = true, features = ["read"] }

# Workspace foundation
dmgez-config.workspace = true
dmgez-core = { workspace = true, features = ["source"] }

# Workspace services
dmgez-inspector.workspace = true

# Hashes and checksums
sha2.workspace = true

# Serialization and configuration
serde.workspace = true

# Async runtime
tokio = { version = "1.54.1", default-features = false, features = ["io-std", "rt"] }

# Command-line interface
clap.workspace = true

# MCP protocol
rmcp = { version = "=3.11.0", default-features = false, features = ["macros", "server"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Filesystem access
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# Filesystem access
fs_at = "=0.2.1"

# Windows filesystem APIs
windows-namespace-request-sys = "=0.5.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Serialization and configuration
serde_json.workspace = true

# Filesystem access and staging
tempfile.workspace = true

[lints]
workspace = true
